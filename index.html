<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 时代个人说明书 · 蔡依凌（Elaine）</title>
<style>
:root{
  --bg0:#060a17; --bg1:#0c1326; --bg2:#14203d;
  --ink:#e9edf7; --ink2:#aab4cc; --ink3:#6f7d99;
  --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.12);
  --acc:#7dd3fc;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background:linear-gradient(168deg,var(--bg0) 0%,var(--bg1) 45%,var(--bg2) 100%);
  color:var(--ink); overflow:hidden; position:relative;
}
::selection{background:rgba(125,211,252,.3)}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.skyline{position:fixed;left:0;right:0;bottom:0;z-index:1;pointer-events:none;opacity:.55}
.skyline svg{display:block;width:100%;height:auto}
.glow{position:fixed;border-radius:50%;filter:blur(70px);opacity:.32;z-index:0;pointer-events:none}
.glow.g1{width:46vmax;height:46vmax;left:-12vmax;top:-16vmax;background:radial-gradient(circle,#1d4ed8,transparent 65%)}
.glow.g2{width:40vmax;height:40vmax;right:-10vmax;bottom:-12vmax;background:radial-gradient(circle,#0e7490,transparent 65%)}

/* ---------- Cover ---------- */
#cover{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 50% 20%,#0d1730 0%,#060a17 70%);
  cursor:pointer;transition:opacity .7s ease;
}
#cover.hide{opacity:0;pointer-events:none}
#cover .inner{text-align:center;padding:24px;animation:coverIn 1.2s ease both}
@keyframes coverIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#cover .kicker{font-size:12px;letter-spacing:.5em;color:var(--ink3);margin-bottom:18px}
#cover h1{font-size:clamp(34px,7vw,64px);font-weight:800;letter-spacing:.08em;background:linear-gradient(120deg,#cfe6ff,#7dd3fc 45%,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
#cover .sub{margin-top:14px;font-size:clamp(14px,2.4vw,19px);color:var(--ink2);letter-spacing:.22em}
#cover .meta{margin-top:34px;font-size:13px;color:var(--ink3)}
#cover .enter{margin-top:42px;display:inline-flex;align-items:center;gap:10px;padding:13px 34px;border:1px solid var(--line);border-radius:999px;color:var(--ink);font-size:15px;letter-spacing:.3em;background:var(--card);backdrop-filter:blur(8px);transition:.3s}
#cover:hover .enter{background:rgba(125,211,252,.14);border-color:rgba(125,211,252,.55);box-shadow:0 0 30px rgba(125,211,252,.25)}

/* ---------- Header ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:14px 22px;background:linear-gradient(180deg,rgba(6,10,23,.9),transparent);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;letter-spacing:.12em;white-space:nowrap}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.brand .zh{color:var(--ink)}
.brand .en{color:var(--ink3);font-size:11px;font-weight:400}
.spacer{flex:1}
.btn-ghost{
  background:transparent;border:1px solid var(--line);color:var(--ink2);font-size:13px;
  padding:7px 15px;border-radius:999px;cursor:pointer;transition:.25s;letter-spacing:.08em;white-space:nowrap;
}
.btn-ghost:hover{color:var(--ink);border-color:rgba(125,211,252,.5);background:rgba(125,211,252,.08)}

/* ---------- Stage ---------- */
#stage{position:fixed;inset:0;z-index:10}
.scene{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:96px clamp(20px,6vw,90px) 92px;opacity:0;visibility:hidden;transform:translateY(18px);
  transition:opacity .55s ease,transform .55s ease,visibility .55s;
}
.scene.on{opacity:1;visibility:visible;transform:none}
.scene-wrap{max-width:980px;width:100%;margin:0 auto}
.scene-top{display:flex;align-items:baseline;gap:18px;margin-bottom:10px}
.scene-no{font-size:clamp(40px,6vw,64px);font-weight:800;line-height:1;letter-spacing:.02em;color:transparent;-webkit-background-clip:text;background-clip:text;background-image:linear-gradient(180deg,var(--acc),transparent 130%);opacity:.95}
.scene-title{font-size:clamp(24px,4.4vw,40px);font-weight:800;letter-spacing:.06em}
.scene-sub{margin-top:4px;color:var(--ink3);font-size:clamp(12px,1.8vw,14px);letter-spacing:.14em}
.scene-body{margin-top:26px;display:flex;flex-direction:column;gap:16px;max-height:58vh;overflow:auto;padding-right:8px}
.scene-body::-webkit-scrollbar{width:4px}
.scene-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:4px}

.blk-h{font-size:clamp(16px,2.6vw,20px);font-weight:700;color:var(--acc);margin:6px 0 2px;letter-spacing:.05em;display:flex;align-items:center;gap:10px}
.blk-h::before{content:"";width:18px;height:2px;border-radius:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.blk-p{color:var(--ink);line-height:1.85;font-size:clamp(14px,2.1vw,16px);text-align:justify}
.blk-p .hl{color:var(--acc)}
.blk-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:640px){.blk-grid{grid-template-columns:1fr}}
.blk-cell{
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  font-size:clamp(13px,2vw,15px);line-height:1.7;backdrop-filter:blur(6px);transition:.25s;
}
.blk-cell b{display:block;color:var(--acc);font-weight:700;margin-bottom:3px}
.blk-cell:hover{background:var(--card2);transform:translateY(-2px)}
.blk-quote{
  border-left:3px solid var(--acc);padding:10px 16px;background:rgba(255,255,255,.04);
  border-radius:0 12px 12px 0;color:var(--ink2);font-size:clamp(13px,2vw,15px);line-height:1.8;font-style:normal;
}

/* ---------- Footer nav ---------- */
footer{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px 22px 18px;display:flex;align-items:center;gap:18px;justify-content:space-between;background:linear-gradient(0deg,rgba(6,10,23,.92),transparent)}
.hint{font-size:12px;color:var(--ink3);letter-spacing:.12em;display:flex;gap:16px;align-items:center}
.hint kbd{font-family:inherit;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--ink2);background:rgba(255,255,255,.06)}
.dots{display:flex;gap:9px;align-items:center}
.dot-btn{width:9px;height:9px;border-radius:50%;border:1px solid var(--line);background:transparent;cursor:pointer;transition:.3s;padding:0}
.dot-btn.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 12px var(--acc);transform:scale(1.25)}
.counter{font-size:12px;color:var(--ink3);letter-spacing:.2em;font-variant-numeric:tabular-nums;white-space:nowrap}
.counter b{color:var(--ink);font-size:15px}

/* ---------- Overview ---------- */
#overview{
  position:fixed;inset:0;z-index:50;background:rgba(4,7,15,.82);backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;padding:30px;opacity:0;visibility:hidden;transition:.35s;
}
#overview.on{opacity:1;visibility:visible}
.ov-inner{width:100%;max-width:840px;max-height:86vh;overflow:auto}
.ov-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.ov-head h2{font-size:22px;letter-spacing:.14em;font-weight:800}
.ov-close{background:transparent;border:1px solid var(--line);color:var(--ink2);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;transition:.25s}
.ov-close:hover{color:var(--ink);border-color:rgba(125,211,252,.5)}
.ov-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ov-item{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:.25s;text-align:left;
}
.ov-item:hover{background:var(--card2);transform:translateY(-3px)}
.ov-item .n{font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--acc)}
.ov-item .t{font-size:16px;font-weight:700;margin-top:6px;letter-spacing:.04em}
.ov-item .d{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.6}

/* ---------- Music button ---------- */
.btn-ghost .eq{display:inline-flex;align-items:flex-end;gap:2px;height:12px;margin-right:7px;vertical-align:-1px}
.btn-ghost .eq i{width:3px;background:currentColor;border-radius:2px;height:5px;transition:height .2s}
.btn-ghost.on{color:var(--acc);border-color:rgba(125,211,252,.65);background:rgba(125,211,252,.12);box-shadow:0 0 16px rgba(125,211,252,.3)}
.btn-ghost.on .eq i{animation:eqb 1.1s ease-in-out infinite}
.btn-ghost.on .eq i:nth-child(2){animation-delay:.18s}
.btn-ghost.on .eq i:nth-child(3){animation-delay:.36s}
@keyframes eqb{0%,100%{height:4px}50%{height:12px}}
</style>
</head>

<script>
"use strict";
/* ============================================================
   内容加载：网页从 content.md 读取文字，方便你自己修改。
   本文件（index.html）是页面外观和交互，一般不需要改。
   ============================================================ */
let DATA = [];
let COVER = { name: "", meta: "" };

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function inline(t){ return esc(t).replace(/\*\*(.+?)\*\*/g, "<b class='hl'>$1</b>"); }

function parseMarkdown(md){
  const lines = md.split(/\r?\n/);
  const scenes = [];
  let cur = null, grid = [], inComment = false;
  function flushGrid(){ if(grid.length && cur){ cur.blocks.push({t:"grid", cols:grid}); } grid = []; }
  for(const raw of lines){
    const line = raw.trim();
    if(inComment){ if(line.indexOf("-->") >= 0) inComment = false; continue; }
    if(line.startsWith("<!--")){
      if(line.indexOf("-->") < 0) inComment = true;
      const cm = line.match(/color\s*:\s*(#[0-9a-fA-F]{3,6})/);
      if(cm && cur && !cur.acc) cur.acc = cm[1];
      const nm = line.match(/cover_name\s*:\s*(.+?)\s*-->/); if(nm) COVER.name = nm[1].trim();
      const mm = line.match(/cover_meta\s*:\s*(.+?)\s*-->/); if(mm) COVER.meta = mm[1].trim();
      continue;
    }
    if(!line){ flushGrid(); continue; }
    if(line.startsWith("# ")){
      flushGrid();
      const rest = line.slice(2).trim();
      const nm2 = rest.match(/^(\d+)\s*(.*)$/);
      cur = { no: nm2 ? nm2[1] : String(scenes.length+1).padStart(2,"0"), title: nm2 ? nm2[2] : rest, sub:"", acc:null, blocks:[] };
      scenes.push(cur);
      continue;
    }
    if(!cur) continue;
    if(line.startsWith("> ")){
      flushGrid();
      if(!cur.sub) cur.sub = line.slice(2).trim();
      else cur.blocks.push({t:"quote", text: inline(line.slice(2).trim())});
      continue;
    }
    if(line.startsWith("## ")){
      flushGrid();
      cur.blocks.push({t:"h", text: inline(line.slice(3).trim())});
      continue;
    }
    if(line.startsWith("|")){
      const cells = line.split("|").slice(1,-1).map(s=>s.trim());
      const isSep = cells.length && cells.every(c => /^:?-{2,}:?$/.test(c));
      if(isSep){ if(grid.length) grid.pop(); continue; }
      if(cells.length >= 2){ grid.push({k:inline(cells[0]), v:inline(cells.slice(1).join(" | "))}); continue; }
    }
    flushGrid();
    cur.blocks.push({t:"p", text: inline(line)});
  }
  flushGrid();
  return scenes;
}

async function loadContent(){
  try{
    const res = await fetch("content.md?v=" + Date.now(), {cache:"no-cache"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    DATA = parseMarkdown(await res.text());
    applyCover();
    render();
  }catch(err){
    document.body.insertAdjacentHTML("beforeend", '<div style="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99;max-width:82%;text-align:center;color:#ffd9d9;background:#3b1520;padding:20px 26px;border-radius:14px;font-size:14px;line-height:1.9">内容文件加载失败：' + esc(err && err.message || err) + '<br>请确认 content.md 已与 index.html 一起发布到仓库。</div>');
  }
}
function applyCover(){
  const subEl = document.querySelector("#cover .sub");
  const metaEl = document.querySelector("#cover .meta");
  if(COVER.name && subEl) subEl.textContent = COVER.name;
  if(COVER.meta && metaEl) metaEl.textContent = COVER.meta;
}

/* ---------- Render ---------- */
const stage = document.getElementById("stage");
const dotsEl = document.getElementById("dots");
const ovList = document.getElementById("ovList");
const curEl = document.getElementById("cur");
const totEl = document.getElementById("tot");

function blkHTML(b){
  if(b.t==="h") return '<div class="blk-h">' + b.text + '</div>';
  if(b.t==="p") return '<div class="blk-p">' + b.text + '</div>';
  if(b.t==="quote") return '<div class="blk-quote">' + b.text + '</div>';
  if(b.t==="grid") return '<div class="blk-grid">' + b.cols.map(function(c){ return '<div class="blk-cell"><b>' + c.k + '</b>' + c.v + '</div>'; }).join("") + '</div>';
  return "";
}

function render(){
  stage.innerHTML = ""; dotsEl.innerHTML = ""; ovList.innerHTML = "";
  DATA.forEach(function(s,i){
    s.acc = s.acc || "#7dd3fc";
    const sec = document.createElement("section");
    sec.className = "scene";
    sec.style.setProperty("--acc", s.acc);
    sec.innerHTML = '<div class="scene-wrap"><div class="scene-top">' +
      '<div class="scene-no">' + s.no + '</div>' +
      '<div><div class="scene-title">' + s.title + '</div><div class="scene-sub">' + s.sub + '</div></div>' +
      '</div><div class="scene-body">' + s.blocks.map(blkHTML).join("") + '</div></div>';
    stage.appendChild(sec);

    const dot = document.createElement("button");
    dot.className = "dot-btn";
    dot.title = s.no + " · " + s.title;
    dot.addEventListener("click", function(){ go(i); });
    dotsEl.appendChild(dot);

    const item = document.createElement("button");
    item.className = "ov-item";
    item.innerHTML = '<div class="n">' + s.no + '</div><div class="t">' + s.title + '</div><div class="d">' + s.sub + '</div>';
    item.addEventListener("click", function(){ go(i); toggleOv(false); });
    ovList.appendChild(item);
  });
  totEl.textContent = String(DATA.length).padStart(2,"0");
  go(0);
}

let cur = 0;
function go(i){
  cur = (i+DATA.length)%DATA.length;
  document.querySelectorAll(".scene").forEach((el,idx)=>el.classList.toggle("on", idx===cur));
  document.querySelectorAll(".dot-btn").forEach((el,idx)=>el.classList.toggle("on", idx===cur));
  curEl.textContent = DATA[cur] ? DATA[cur].no : "--";
  document.body.style.setProperty("--acc", DATA[cur] ? DATA[cur].acc : "#7dd3fc");
}
/* ---------- Cover ---------- */
const cover = document.getElementById("cover");
cover.addEventListener("click", ()=>cover.classList.add("hide"));

/* ---------- Overview ---------- */
const ov = document.getElementById("overview");
function toggleOv(v){ ov.classList.toggle("on", v!==undefined?v:!ov.classList.contains("on")); }
document.getElementById("ovBtn").addEventListener("click", ()=>toggleOv(true));
document.getElementById("ovClose").addEventListener("click", ()=>toggleOv(false));
ov.addEventListener("click", e=>{ if(e.target===ov) toggleOv(false); });

/* ---------- Keys ---------- */
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ toggleOv(false); return; }
  if(e.key==="ArrowRight"){ go(cur+1); return; }
  if(e.key==="ArrowLeft"){ go(cur-1); return; }
});

/* ---------- Stars ---------- */
const cv = document.getElementById("stars"), ctx = cv.getContext("2d");
let W,H,stars=[];
function resize(){
  W=cv.width=innerWidth; H=cv.height=innerHeight;
  const n=Math.min(180,Math.floor(W*H/9000));
  stars=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.4+.4,a:Math.random()*.7+.2,s:Math.random()*.02+.004,p:Math.random()*Math.PI*2}));
}
function draw(){
  ctx.clearRect(0,0,W,H);
  for(const st of stars){
    st.a = .25 + .45*(1+Math.sin(st.p+=st.s))/2;
    ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,7); ctx.fillStyle=`rgba(190,215,255,${st.a})`; ctx.fill();
  }
  requestAnimationFrame(draw);
}
resize(); addEventListener("resize",resize); draw();

/* ---------- Music ---------- */
const musicBtn = document.getElementById("musicBtn");
const Music = (() => {
  let ctx = null, master = null, reverb = null, padTimer = null, pluckTimer = null, chordIdx = 0;
  let playing = false, fileAudio = null, fileOk = false, synthOn = false;
  const chords = [[60,64,67,71],[57,60,64,67],[53,57,60,64],[55,59,62,67]];
  const pent = [60,62,64,67,69,72,74,76,79,81];
  const midi = f => 440 * Math.pow(2, (f-69)/12);
  function buildIR(sec, decay){
    const rate = ctx.sampleRate, len = Math.floor(rate*sec);
    const buf = ctx.createBuffer(2, len, rate);
    for(let c=0;c<2;c++){
      const d = buf.getChannelData(c);
      for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/len, decay);
    }
    return buf;
  }
  function ensureCtx(){
    if(!ctx){
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.15; master.connect(ctx.destination);
      reverb = ctx.createConvolver(); reverb.buffer = buildIR(2.6, 2.0);
      const wet = ctx.createGain(); wet.gain.value = 0.45; reverb.connect(wet); wet.connect(master);
    }
    if(ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function schedule(){
    const t = ctx.currentTime + 0.1;
    const chord = chords[chordIdx % chords.length]; chordIdx++;
    const dur = 7;
    chord.forEach(n => {
      const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = midi(n);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.14, t + 1.5);
      g.gain.setValueAtTime(0.14, t + dur - 1.3);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(master);
      const g2 = ctx.createGain(); g2.gain.value = 0.6; g.connect(g2); g2.connect(reverb);
      o.start(t); o.stop(t + dur + 0.3);
    });
    const bo = ctx.createOscillator(); bo.type = "sine"; bo.frequency.value = midi(chord[0]-12);
    const bg = ctx.createGain();
    bg.gain.setValueAtTime(0.0001, t);
    bg.gain.exponentialRampToValueAtTime(0.09, t + 1.2);
    bg.gain.setValueAtTime(0.09, t + dur - 1);
    bg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    bo.connect(bg); bg.connect(master); bo.start(t); bo.stop(t + dur + 0.3);
  }
  function pluck(){
    if(!playing || !ctx) return;
    const t = ctx.currentTime + 0.02;
    const n = pent[Math.floor(Math.random()*pent.length)] + [0,12,24][Math.floor(Math.random()*3)];
    const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = midi(n);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.11, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.4);
    o.connect(g); g.connect(master);
    const g2 = ctx.createGain(); g2.gain.value = 0.7; g.connect(g2); g2.connect(reverb);
    o.start(t); o.stop(t + 2.6);
  }
  function startSynth(){
    if(synthOn) return; synthOn = true;
    ensureCtx();
    schedule();
    padTimer = setInterval(schedule, 6000);
    pluckTimer = setInterval(pluck, 2100);
  }
  function stopSynth(){
    if(!synthOn) return; synthOn = false;
    clearInterval(padTimer); clearInterval(pluckTimer);
  }
  function start(){
    if(playing) return; playing = true;
    if(!fileAudio){
      fileAudio = new Audio();
      fileAudio.loop = true; fileAudio.volume = 0.45;
      fileAudio.addEventListener("error", () => { if(playing) startSynth(); });
      fileAudio.addEventListener("canplaythrough", () => { if(playing){ fileOk = true; stopSynth(); fileAudio.play().catch(()=>{}); } });
      fileAudio.src = "music.mp3";
      fileAudio.load();
    } else if(fileOk){
      stopSynth(); fileAudio.play().catch(()=>{});
    } else {
      startSynth();
    }
  }
  function stop(){
    if(!playing) return; playing = false;
    stopSynth();
    if(fileAudio && fileOk){ try{ fileAudio.pause(); }catch(e){} }
    try{ if(ctx) ctx.suspend(); }catch(e){}
  }
  return { start, stop, isPlaying: () => playing };
})();

function setMusicBtn(on){
  musicBtn.classList.toggle("on", on);
  musicBtn.setAttribute("aria-pressed", on ? "true" : "false");
  musicBtn.title = on ? "暂停背景音乐" : "播放背景音乐";
}

musicBtn.addEventListener("click", () => {
  if(Music.isPlaying()){ Music.stop(); localStorage.setItem("handbook_music","0"); setMusicBtn(false); }
  else { Music.start(); localStorage.setItem("handbook_music","1"); setMusicBtn(true); }
});
if(localStorage.getItem("handbook_music") === "1"){
  setMusicBtn(true);
  const startOnGesture = (e) => { if(e.target && e.target.closest && e.target.closest("#musicBtn")) return; Music.start(); document.removeEventListener("pointerdown", startOnGesture); document.removeEventListener("keydown", startOnGesture); };
  document.addEventListener("pointerdown", startOnGesture);
  document.addEventListener("keydown", startOnGesture);
}

loadContent();
</script>
